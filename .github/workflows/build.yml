
name: Build JailRa1n

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          ls -la
          ls -la JailRa1n
          ls -la JailRa1n/JailRa1n.xcodeproj
          test -f JailRa1n/JailRa1n.xcodeproj/project.pbxproj

      - name: Build iOS app
        run: |
          xcodebuild \
            -project JailRa1n/JailRa1n.xcodeproj \
            -scheme JailRa1n \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build
