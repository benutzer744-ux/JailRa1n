
name: Build JailRa1n

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode and project files
        run: |
          xcodebuild -version
          test -f project.yml
          test -f JailRa1n/ContentView.swift
          test -f JailRa1n/JailRa1nApp.swift
          test -f JailRa1n/JailbreakEngine.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          test -f JailRa1n.xcodeproj/project.pbxproj

      - name: Build JailRa1n for iOS 16+
        run: |
          xcodebuild \
            -project JailRa1n.xcodeproj \
            -scheme JailRa1n \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/JailRa1nBuild" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Configure Sileo and Cydia detection
        run: |
          APP_PATH="$RUNNER_TEMP/JailRa1nBuild/Build/Products/Release-iphoneos/JailRa1n.app"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes array' "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:0 string sileo' "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:1 string cydia' "$APP_PATH/Info.plist" || true

      - name: Verify minimum iOS version
        run: |
          APP_PATH="$RUNNER_TEMP/JailRa1nBuild/Build/Products/Release-iphoneos/JailRa1n.app"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist"

      - name: Package JailRa1n IPA
        run: |
          APP_PATH="$RUNNER_TEMP/JailRa1nBuild/Build/Products/Release-iphoneos/JailRa1n.app"
          mkdir -p "$RUNNER_TEMP/JailRa1nPackage/Payload" output
          cp -R "$APP_PATH" "$RUNNER_TEMP/JailRa1nPackage/Payload/"
          cd "$RUNNER_TEMP/JailRa1nPackage"
          zip -qry "$GITHUB_WORKSPACE/output/JailRa1n.ipa" Payload

      - name: Verify IPA
        run: |
          test -s output/JailRa1n.ipa
          unzip -l output/JailRa1n.ipa | grep 'Payload/JailRa1n.app/'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JailRa1n-IPA
          path: output/JailRa1n.ipa
          if-no-files-found: error
          retention-days: 14
